<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
html{background:#1a2667}
body{position:fixed;inset:0;background:#1a2667}
#app{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(180deg,#4c6fd0 0%,#3653b0 32%,#273d8f 62%,#1b2a6c 100%);touch-action:none}
#app::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 50% 0%,rgba(140,180,255,.28),rgba(140,180,255,0) 60%);pointer-events:none}
@media (min-aspect-ratio:3/4){
 body{background:radial-gradient(80% 90% at 50% 40%,#26336e 0%,#10163a 70%,#0a0e26 100%)}
 #app{left:50%;top:50%;height:min(calc(100% - 32px),940px);width:calc(min(calc(100vh - 32px),940px)*0.4621);transform:translate(-50%,-50%);border-radius:38px;box-shadow:0 0 0 10px #0b0f24,0 0 0 12px #2b3460,0 30px 80px rgba(0,0,0,.6)}
}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#probe{position:absolute;left:0;top:0;width:0;padding-top:var(--sat);padding-bottom:var(--sab);visibility:hidden;pointer-events:none}
.hbtn{position:absolute;width:40px;height:40px;border-radius:12px;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#5d82e6,#3a59b8);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.25),0 3px 8px rgba(0,0,0,.25);color:#fff;cursor:pointer;touch-action:manipulation;z-index:2}
.hbtn:active{transform:translateY(1px) scale(.96)}
.hbtn svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#over{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(10,16,48,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .35s}
#over.show{opacity:1;pointer-events:auto}
#over .card{width:min(82%,330px);padding:26px 22px 24px;border-radius:26px;text-align:center;color:#fff;background:linear-gradient(180deg,#4b6fd8 0%,#2b419a 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),inset 0 -4px 0 rgba(0,0,0,.25),0 20px 50px rgba(0,0,0,.5);transform:scale(.8);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
#over.show .card{transform:scale(1)}
#over h2{margin:0 0 14px;font-size:28px;font-weight:900;letter-spacing:.5px;text-shadow:0 3px 0 rgba(0,0,0,.25)}
#over .lbl{font-size:14px;font-weight:700;opacity:.75;text-transform:uppercase;letter-spacing:2px;margin-top:8px}
#over .big{font-size:52px;font-weight:900;line-height:1.05;text-shadow:0 4px 0 rgba(0,0,0,.25)}
#over .best{font-size:26px;font-weight:900;color:#ffd447}
#newBest{display:none;margin:10px auto 0;padding:4px 14px;border-radius:999px;background:#ffcf3a;color:#6a3a00;font-weight:900;font-size:14px;width:max-content}
#restart{margin-top:22px;width:100%;height:58px;border:0;border-radius:18px;font-size:22px;font-weight:900;color:#fff;letter-spacing:.5px;background:linear-gradient(180deg,#5fe07a,#27b14a);box-shadow:inset 0 2px 0 rgba(255,255,255,.45),inset 0 -5px 0 rgba(0,0,0,.2),0 6px 14px rgba(0,0,0,.3);cursor:pointer;touch-action:manipulation;font-family:inherit}
#restart:active{transform:translateY(2px)}
</style>

<body>
<div id="app">
 <canvas id="cv"></canvas>
 <div id="probe"></div>
 <button class="hbtn" id="btnRestart" aria-label="Restart"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg></button>
 <button class="hbtn" id="btnMute" aria-label="Sound"><svg viewBox="0 0 24 24" id="muteIcon"></svg></button>
 <div id="over"><div class="card">
  <h2 id="ovTitle">No More Space!</h2>
  <div class="lbl">Score</div><div class="big" id="ovScore">0</div>
  <div class="lbl">Best</div><div class="best" id="ovBest">0</div>
  <div id="newBest">NEW BEST!</div>
  <button id="restart">Play Again</button>
 </div></div>
</div>
<script>
(()=>{
'use strict';
const N=8, KEY='blockburst.save.v1', KBEST='blockburst.best', KMUTE='blockburst.mute';
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ---------- PWA: manifest only when served over http(s) (file:// can't fetch it) ---------- */
if(/^https?:$/.test(location.protocol)){const l=document.createElement('link');l.rel='manifest';l.href='manifest.json';document.head.appendChild(l);}

/* ---------- Colors (base hex). 7 = grey (game over) ---------- */
const COLORS=['#f2434f','#ff8f22','#ffcc1f','#3fcf56','#27c3ef','#3d6ef5','#9b55f0','#7d86a8'];
function hex2rgb(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function shade(h,a){const[r,g,b]=hex2rgb(h);const t=a<0?0:255,p=Math.abs(a);return`rgb(${Math.round(r+(t-r)*p)},${Math.round(g+(t-g)*p)},${Math.round(b+(t-b)*p)})`}

/* ---------- Pieces: every rotation is its own piece (no in-game rotation, like the original) ---------- */
function norm(cells){const mr=Math.min(...cells.map(a=>a[0])),mc=Math.min(...cells.map(a=>a[1]));return cells.map(([r,c])=>[r-mr,c-mc]).sort((a,b)=>a[0]-b[0]||a[1]-b[1])}
function parse(rows){const o=[];rows.forEach((s,r)=>[...s].forEach((ch,c)=>{if(ch==='#')o.push([r,c])}));return norm(o)}
function rot(cells){return norm(cells.map(([r,c])=>[c,-r]))}
const keyOf=cells=>cells.map(a=>a.join(',')).join(';');
// [name, rows, number of rotations, weight per variant, difficulty class]
const DEFS=[
 ['dot',['#'],1,1.2,'e'],
 ['I2',['##'],2,4,'e'],['I3',['###'],2,5,'e'],['I4',['####'],2,4,'e'],['I5',['#####'],2,3,'e'],
 ['O2',['##','##'],1,6,'e'],['O3',['###','###','###'],1,2.6,'e'],
 ['R23',['###','###'],2,3,'e'],
 ['L',['#.','#.','##'],4,2.2,'m'],['J',['.#','.#','##'],4,2.2,'m'],
 ['BL',['#.','#.','#.','##'],4,0.9,'h'],['BJ',['.#','.#','.#','##'],4,0.9,'h'],
 ['T',['###','.#.'],4,2,'h'],
 ['S',['.##','##.'],2,1.6,'h'],['Z',['##.','.##'],2,1.6,'h'],
 ['C2',['#.','##'],4,3.4,'m'],['C3',['#..','#..','###'],4,1.7,'m'],
];
const SHAPES=[];{const seen=new Set();for(const[name,rows,nr,w,cls]of DEFS){let c=parse(rows);for(let k=0;k<nr;k++){const key=keyOf(c);if(!seen.has(key)){seen.add(key);const h=Math.max(...c.map(a=>a[0]))+1,wd=Math.max(...c.map(a=>a[1]))+1;SHAPES.push({name:k?name+'_'+k:name,cells:c,h,w:wd,n:c.length,wt:w,cls});}c=rot(c);}}}

/* ---------- Board helpers ---------- */
function fits(b,p,r0,c0){if(r0<0||c0<0||r0+p.h>N||c0+p.w>N)return false;for(const[dr,dc]of p.cells)if(b[(r0+dr)*N+c0+dc]>=0)return false;return true}
function anyFit(b,p){for(let r=0;r<=N-p.h;r++)for(let c=0;c<=N-p.w;c++)if(fits(b,p,r,c))return true;return false}
function fullLines(b){const rows=[],cols=[];for(let r=0;r<N;r++){let f=1;for(let c=0;c<N;c++)if(b[r*N+c]<0){f=0;break}if(f)rows.push(r)}for(let c=0;c<N;c++){let f=1;for(let r=0;r<N;r++)if(b[r*N+c]<0){f=0;break}if(f)cols.push(c)}return{rows,cols}}
function simPlace(b,p,r0,c0){const t=b.slice();for(const[dr,dc]of p.cells)t[(r0+dr)*N+c0+dc]=0;const{rows,cols}=fullLines(t);for(const r of rows)for(let c=0;c<N;c++)t[r*N+c]=-1;for(const c of cols)for(let r=0;r<N;r++)t[r*N+c]=-1;return{t,L:rows.length+cols.length}}
let budget=0;
function solvable(b,ps){if(!ps.length)return true;for(let i=0;i<ps.length;i++){if(i>0&&ps[i]===ps[i-1])continue;const p=ps[i],rest=ps.slice(0,i).concat(ps.slice(i+1));for(let r=0;r<=N-p.h;r++)for(let c=0;c<=N-p.w;c++){if(--budget<0)return false;if(fits(b,p,r,c)&&solvable(simPlace(b,p,r,c).t,rest))return true}}return false}
function canClear(b,p){for(let r=0;r<=N-p.h;r++)for(let c=0;c<=N-p.w;c++)if(fits(b,p,r,c)&&simPlace(b,p,r,c).L>0)return true;return false}
const lineScore=(L,C)=>L<=0?0:L===1?10*C:10*C*L*(L-1);

/* ---------- Weighted, board-aware dealing ---------- */
function weights(b){const fill=b.filter(v=>v>=0).length/64;return SHAPES.map(s=>{let w=s.wt;if(fill>0.45){if(s.n<=3)w*=1.8;if(s.n>=6)w*=0.45}if(fill>0.62){if(s.n<=3)w*=1.8;if(s.n>=6)w*=0.4;if(s.cls==='h')w*=0.7}return w})}
function pickW(ws){let t=0;for(const w of ws)t+=w;let x=Math.random()*t;for(let i=0;i<ws.length;i++){x-=ws[i];if(x<=0)return i}return ws.length-1}
function dealTray(b){
 const ws=weights(b),fill=b.filter(v=>v>=0).length/64;let first=null,pick=null;
 for(let a=0;a<70&&!pick;a++){
  const t=[pickW(ws),pickW(ws),pickW(ws)];if(t[0]===t[1]&&t[1]===t[2])continue;
  const ps=t.map(i=>SHAPES[i]);budget=5000;
  if(solvable(b,ps.slice().sort((x,y)=>SHAPES.indexOf(x)-SHAPES.indexOf(y)))){
   if(!first)first=t;
   // "gap assist": on a busy board prefer a hand that offers a clear
   if(fill<0.25||Math.random()<0.35||ps.some(p=>canClear(b,p)))pick=t;
  }
  if(a>35&&first)pick=first;
 }
 pick=pick||first;
 if(!pick){for(let a=0;a<80;a++){const t=[pickW(ws),pickW(ws),pickW(ws)];if(t.some(i=>anyFit(b,SHAPES[i]))){pick=t;break}}}
 if(!pick){const ok=SHAPES.map((s,i)=>i).filter(i=>anyFit(b,SHAPES[i]));pick=[ok.length?ok[(Math.random()*ok.length)|0]:pickW(ws),pickW(ws),pickW(ws)]}
 const cols=[0,1,2,3,4,5,6].sort(()=>Math.random()-.5);
 return pick.map((s,i)=>({s,c:cols[i]}));
}

/* ---------- State ---------- */
let S,best=+store.get(KBEST)||0,muted=store.get(KMUTE)==='1',shown=0,over=false,overT0=0;
function newGame(){S={board:Array(64).fill(-1),tray:null,score:0,combo:0,miss:0,round:0,startBest:best};over=false;shown=0;dealNew();save()}
function save(){if(over){store.del(KEY);return}store.set(KEY,JSON.stringify(S))}
function load(){try{const o=JSON.parse(store.get(KEY));if(o&&Array.isArray(o.board)&&o.board.length===64&&Array.isArray(o.tray)&&o.tray.length===3&&o.tray.every(t=>t===null||(t&&SHAPES[t.s]))){if(o.startBest===undefined)o.startBest=best;S=o;shown=o.score;return true}}catch(e){}return false}
function dealNew(){S.tray=dealTray(S.board);S.round++;const now=performance.now();popIn=[now,now+70,now+140];}

let AC=null,master=null,noiseBuf=null;
function ensureAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C();master=AC.createGain();master.gain.value=0.55;master.connect(AC.destination);noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}if(AC.state!=='running')AC.resume()}catch(e){}}
function env(gn,t,a,d,v){gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(v,t+a);gn.gain.exponentialRampToValueAtTime(0.0001,t+a+d)}
function tone(f,d,o={}){if(!AC||muted)return;const t=AC.currentTime+(o.at||0),os=AC.createOscillator(),gn=AC.createGain();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.f2)os.frequency.exponentialRampToValueAtTime(o.f2,t+d);env(gn,t,o.a||0.005,d,o.v||0.2);os.connect(gn);gn.connect(master);os.start(t);os.stop(t+(o.a||0.005)+d+0.05)}
function noise(d,o={}){if(!AC||muted)return;const t=AC.currentTime+(o.at||0),src=AC.createBufferSource(),f=AC.createBiquadFilter(),gn=AC.createGain();src.buffer=noiseBuf;f.type=o.type||'bandpass';f.Q.value=o.q||1;f.frequency.setValueAtTime(o.fc||2000,t);if(o.fc2)f.frequency.exponentialRampToValueAtTime(o.fc2,t+d);env(gn,t,o.a||0.005,d,o.v||0.15);src.connect(f);f.connect(gn);gn.connect(master);src.start(t);src.stop(t+d+0.1)}
const NOTES=[523.25,587.33,659.25,783.99,880,1046.5,1174.66,1318.5,1567.98,1760,2093];
const sfx={

const eob=k=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(k-1,3)+c1*Math.pow(k-1,2)};

/* ---------- Placement / rules ---------- */
function commit(i,r0,c0){
 const it=S.tray[i],p=SHAPES[it.s],now=performance.now(),{cell,bx,by}=Lo;
 for(const[dr,dc]of p.cells){S.board[(r0+dr)*N+c0+dc]=it.c;flashes.push({r:r0+dr,c:c0+dc,t0:now})}
 S.tray[i]=null;
 const{rows,cols}=fullLines(S.board),L=rows.length+cols.length;let gained=p.n;
 const cx=bx+(c0+p.w/2)*cell,cy=by+(r0+p.h/2)*cell;
 if(L>0){
  S.combo++;S.miss=0;gained+=lineScore(L,S.combo);
  const kill=new Set();for(const r of rows)for(let c=0;c<N;c++)kill.add(r*N+c);for(const c of cols)for(let r=0;r<N;r++)kill.add(r*N+c);
  const pr=r0+p.h/2-0.5,pc=c0+p.w/2-0.5;
  for(const k of kill){const r=(k/N)|0,c=k%N;clears.push({r,c,ci:S.board[k],start:now+Math.hypot(r-pr,c-pc)*28,dur:260,burst:false});S.board[k]=-1}
 }else{S.miss++;if(S.miss>=3){S.combo=0;S.miss=0}}
 const allClear=L>0&&S.board.every(v=>v<0);if(allClear)gained+=300;
 S.score+=gained;if(S.score>best){best=S.score;store.set(KBEST,best)}
 // feedback
 sfx.place();buzz(12);
 if(L>0){
  setTimeout(()=>sfx.clear(L,S.combo),40);buzz(L>=2?[25,40,35]:25);
  popup('+'+gained,cx,cy+(S.combo>=2?cell*0.45:0),{kind:'score',size:cell*0.62,dur:900});
  if(S.combo>=2){popup('Combo x'+S.combo,cx,cy-cell*0.75,{kind:'combo',size:cell*0.7,dur:1200});setTimeout(()=>sfx.combo(S.combo),60)}
  const PR=['','','Good!','Great!','Excellent!','Amazing!','Unbelievable!'];
  if(allClear){popup('ALL CLEAR!',bx+Lo.bs/2,by+Lo.bs*0.42,{size:cell*1.15,dur:1700,kind:'all'});popup('+300',bx+Lo.bs/2,by+Lo.bs*0.42+cell*1.15,{kind:'score',size:cell*0.75,dur:1500});setTimeout(sfx.allclear,250);buzz([40,40,40,40,80])}
  else if(L>=2)popup(PR[Math.min(L,6)],bx+Lo.bs/2,by+Lo.bs*0.4,{size:cell*(0.95+Math.min(L,6)*0.07)});
  if(L>=3||allClear){shake.t0=now;shake.amp=Math.min(12,2+L*1.6+(allClear?5:0))}
 }
 if(S.tray.every(t=>!t)){dealNew();setTimeout(sfx.deal,120)}
 checkOver();save();
}
function checkOver(){if(over)return;const live=S.tray.filter(Boolean);if(live.length&&!live.some(t=>anyFit(S.board,SHAPES[t.s]))){over=true;overT0=performance.now();store.del(KEY);setTimeout(()=>{sfx.over();buzz([60,60,120])},350);setTimeout(showOver,1300)}}
function showOver(){const o=document.getElementById('over'),prev=S.startBest||0;document.getElementById('ovScore').textContent=S.score;document.getElementById('ovBest').textContent=best;document.getElementById('newBest').style.display=S.score>0&&S.score>=best&&S.score>prev?'block':'none';o.classList.add('show')}

function local(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function dragGeom(now){
 const it=S.tray[drag.i],p=SHAPES[it.s],{cell}=Lo,tc=tsz(p),k=eo(Math.min(1,(now-drag.t0)/120)),size=tc+(cell-tc)*k;
 const tcx=drag.x,tcy=drag.y-drag.lift-p.h*cell/2;const sl=Lo.slots[drag.i];
 const cx=sl.x+(tcx-sl.x)*k,cy=sl.y+(tcy-sl.y)*k;
 return{p,size,cx,cy,tx:tcx-p.w*cell/2,ty:tcy-p.h*cell/2};
}
function computeSnap(){
 if(!drag){snap=null;return}const g=dragGeom(drag.t0+1e4),{cell,bx,by}=Lo;
 let c0=Math.round((g.tx-bx)/cell),r0=Math.round((g.ty-by)/cell);
 // tolerate slight overhang at edges
 if(!fits(S.board,g.p,r0,c0)){const fx=(g.tx-bx)/cell,fy=(g.ty-by)/cell;let bestD=0.62,bb=null;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){const rr=Math.round(fy)+dr,cc=Math.round(fx)+dc,d=Math.hypot(rr-fy,cc-fx);if(d<bestD&&fits(S.board,g.p,rr,cc)){bestD=d;bb=[rr,cc]}}
  if(!bb){snap=null;return}[r0,c0]=bb}
 const t=S.board.slice();for(const[dr,dc]of g.p.cells)t[(r0+dr)*N+c0+dc]=99;const fl=fullLines(t);snap={r0,c0,rows:fl.rows,cols:fl.cols};
}
cv.addEventListener('pointerdown',e=>{
 ensureAudio();if(over||drag||!S)return;const{x,y}=local(e),{trayY,trayH,cell}=Lo;
 if(y<trayY-cell*0.8||y>trayY+trayH+cell)return;
 let bi=-1,bd=1e9;for(let i=0;i<3;i++){if(!S.tray[i]||(ret&&ret.i===i))continue;const d=Math.abs(x-Lo.slots[i].x);if(d<Lo.slotW*0.62&&d<bd){bd=d;bi=i}}
 if(bi<0)return;e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
 drag={i:bi,x,y,t0:performance.now(),id:e.pointerId,lift:e.pointerType==='mouse'?cell*0.35:cell*1.25};sfx.pick();buzz(6);computeSnap();
},{passive:false});
cv.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;e.preventDefault();const{x,y}=local(e);drag.x=x;drag.y=y;computeSnap()},{passive:false});

 if(!drag||e.pointerId!==drag.id)return;ensureAudio();const{x,y}=local(e);if(!cancel){drag.x=x;drag.y=y;computeSnap()}
 const now=performance.now();
 if(!cancel&&snap){const s=snap,i=drag.i;drag=null;snap=null;commit(i,s.r0,s.c0)}
 else{const g=dragGeom(now);ret={i:drag.i,cx:g.cx,cy:g.cy,size:g.size,t0:now};drag=null;snap=null;sfx.bad()}
}

/* ---------- Rendering ---------- */

function drawPiece(p,ci,x,y,size,alpha){const sp=sprite(ci,size);if(alpha!==undefined)ctx.globalAlpha=alpha;for(const[r,c]of p.cells)ctx.drawImage(sp,x+c*size,y+r*size,size,size);ctx.globalAlpha=1}

 ctx.font=`800 ${Math.round(cell*0.55)}px ${FONT}`;ctx.fillStyle='#ffd447';ctx.fillText(String(best),bx+cs*1.3+6,top+cell*0.15+20);
 ctx.textAlign='center';const sc=String(Math.floor(shown)),fs=Math.round(cell*(sc.length>5?1.15:1.35));
 const bump=S.score>shown?1.04:1;ctx.save();ctx.translate(W/2,top+hh*0.66);ctx.scale(bump,bump);
 ctx.font=`900 ${fs}px ${FONT}`;ctx.fillStyle='rgba(10,20,70,.35)';ctx.fillText(sc,0,4);ctx.fillStyle='#fff';ctx.fillText(sc,0,0);ctx.restore();
 // shake

 // board blocks (+ preview recolor)
 const hl=new Set();let hci=-1;
 if(drag&&snap){hci=S.tray[drag.i].c;for(const r of snap.rows)for(let c=0;c<N;c++)hl.add(r*N+c);for(const c of snap.cols)for(let r=0;r<N;r++)hl.add(r*N+c)}
 const og=over?(now-overT0)/70:-1;
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const v=S.board[r*N+c];if(v<0)continue;let ci=hl.has(r*N+c)?hci:v;if(over&&og>(N-1-r))ci=7;ctx.drawImage(sprite(ci,cell),bx+c*cell,by+r*cell,cell,cell)}
 if(drag&&snap){const it=S.tray[drag.i],p=SHAPES[it.s];
  if(hl.size){drawPiece(p,it.c,bx+snap.c0*cell,by+snap.r0*cell,cell,0.9);ctx.save();ctx.globalAlpha=0.18+0.12*Math.sin(now*0.012);ctx.fillStyle='#fff';for(const k of hl)ctx.fillRect(bx+(k%N)*cell,by+((k/N)|0)*cell,cell,cell);ctx.restore()}
  else drawPiece(p,it.c,bx+snap.c0*cell,by+snap.r0*cell,cell,0.38)}
 // placement flash
 flashes=flashes.filter(f=>{const k=(now-f.t0)/180;if(k>=1)return false;ctx.fillStyle=`rgba(255,255,255,${0.45*(1-k)})`;ctx.fillRect(bx+f.c*cell,by+f.r*cell,cell,cell);return true});
 // clearing cells -> shatter
 clears=clears.filter(o=>{const x=bx+o.c*cell,y=by+o.r*cell;if(now<o.start){ctx.drawImage(sprite(o.ci,cell),x,y,cell,cell);return true}
  if(!o.burst){o.burst=true;for(let i=0;i<(clears.length>40?3:5);i++){const a=Math.random()*Math.PI*2,sp=(60+Math.random()*200);parts.push({x:x+cell/2,y:y+cell/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-140,r:Math.random()*6,vr:(Math.random()-.5)*12,s:cell*(0.22+Math.random()*0.22),ci:o.ci,life:0.7+Math.random()*0.4,t:0})}}
  const k=(now-o.start)/o.dur;if(k>=1)return false;const s=cell*(1-0.6*eo(k));ctx.globalAlpha=1-k;ctx.drawImage(sprite(o.ci,cell),x+(cell-s)/2,y+(cell-s)/2,s,s);ctx.fillStyle=`rgba(255,255,255,${0.7*(1-k)})`;ctx.fillRect(x+(cell-s)/2,y+(cell-s)/2,s,s);ctx.globalAlpha=1;return true});
 ctx.restore();
 // particles (unshaken, on top of everything)
 parts=parts.filter(q=>{q.t+=dt;if(q.t>=q.life)return false;q.vy+=900*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.r+=q.vr*dt;const a=1-q.t/q.life;ctx.save();ctx.globalAlpha=a;ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.drawImage(sprite(q.ci,cell*0.5),-q.s/2,-q.s/2,q.s,q.s);ctx.restore();return true});
 // tray
 for(let i=0;i<3;i++){const it=S.tray[i];if(!it||(drag&&drag.i===i)||(ret&&ret.i===i))continue;const p=SHAPES[it.s],sl=Lo.slots[i];
  const k=Math.max(0,Math.min(1,(now-popIn[i])/320)),sc=k<=0?0:eob(k);if(sc<=0.01)continue;
  const dead=over||!anyFit(S.board,p);ctx.save();ctx.translate(sl.x,sl.y);const ts=tsz(p);ctx.scale(sc,sc);drawPiece(p,(over&&og>3)?7:it.c,-p.w*ts/2,-p.h*ts/2,ts,dead&&!over?0.4:1);ctx.restore()}
 if(ret){const k=Math.min(1,(now-ret.t0)/170),e=eo(k),it=S.tray[ret.i];if(it){const p=SHAPES[it.s],sl=Lo.slots[ret.i],cx=ret.cx+(sl.x-ret.cx)*e,cy=ret.cy+(sl.y-ret.cy)*e,s=ret.size+(tsz(p)-ret.size)*e;drawPiece(p,it.c,cx-p.w*s/2,cy-p.h*s/2,s)}if(k>=1)ret=null}
 if(drag){const it=S.tray[drag.i],g=dragGeom(now);ctx.save();ctx.shadowColor='rgba(0,0,20,.45)';ctx.shadowBlur=12;ctx.shadowOffsetY=6;drawPiece(g.p,it.c,g.cx-g.p.w*g.size/2,g.cy-g.p.h*g.size/2,g.size);ctx.restore()}
 // popups
 pops=pops.filter(o=>{const k=(now-o.t0)/o.dur;if(k>=1)return false;const s=k<0.18?eob(k/0.18):1,a=k>0.72?1-(k-0.72)/0.28:1;
  const y=o.y-(o.kind==='score'?eo(k)*cell*0.7:k*cell*0.5);const x=Math.max(o.size*2.2,Math.min(W-o.size*2.2,o.x));
  ctx.save();ctx.globalAlpha=a;ctx.translate(x,y);ctx.scale(s,s);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
  ctx.font=`900 ${Math.round(o.size)}px ${FONT}`;let fill;
  if(o.kind==='score'){fill='#fff';ctx.lineWidth=o.size*0.18;ctx.strokeStyle='rgba(20,30,90,.85)'}
  else if(o.kind==='combo'){const g=ctx.createLinearGradient(0,-o.size/2,0,o.size/2);g.addColorStop(0,'#bff7ff');g.addColorStop(1,'#2fc6ff');fill=g;ctx.lineWidth=o.size*0.2;ctx.strokeStyle='#123a8a'}
  else{const g=ctx.createLinearGradient(0,-o.size/2,0,o.size/2);g.addColorStop(0,'#fff6a8');g.addColorStop(0.5,'#ffd23a');g.addColorStop(1,'#ff8a1c');fill=g;ctx.lineWidth=o.size*0.2;ctx.strokeStyle=o.kind==='all'?'#7a1fa8':'#5a2a9a'}
  ctx.strokeText(o.text,0,0);ctx.fillStyle=fill;ctx.fillText(o.text,0,0);ctx.restore();return true});
}
function frame(now){draw(now);requestAnimationFrame(frame)}

/* ---------- Test hooks (harmless in production) ---------- */
window.BB={
 state:()=>JSON.parse(JSON.stringify({...S,best,over})),layout:()=>({...Lo,W,H}),shapes:SHAPES.map(s=>({name:s.name,n:s.n,w:s.w,h:s.h})),
 set(o){Object.assign(S,JSON.parse(JSON.stringify(o)));if(o.score!==undefined)shown=o.score;over=false;document.getElementById('over').classList.remove('show');popIn=[0,0,0];save()},
 tray(names,cols){S.tray=names.map((n,i)=>n===null?null:({s:SHAPES.findIndex(s=>s.name===n),c:cols?cols[i]:i}));popIn=[0,0,0];save();checkOver()},
 lineScore,dealTray:(b)=>dealTray(b||S.board).map(t=>SHAPES[t.s].name),solvable:(b,names)=>{budget=1e6;return solvable(b,names.map(n=>SHAPES.find(s=>s.name===n)))}
};

setMute(muted);resize();
if(!load())newGame();else checkOver();
if(over)showOver();
requestAnimationFrame(frame);
})();
